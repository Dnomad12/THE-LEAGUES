name: Sync Sheets to JSON

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync sheets to JSON
        run: python scripts/sync_sheets_to_json.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync Shuffleboard & Petanque data from Google Sheets"
          file_pattern: 'shuffleboard/*.json petanque/*.json'
