name: Process Darts Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'darts/incoming/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether any screenshot was actually added
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -- always processing."
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-status HEAD^ HEAD -- darts/incoming/ | grep -q '^A'; then
            echo "New screenshot(s) added -- processing."
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "No files were added to darts/incoming/ in this commit (likely a deletion) -- skipping."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.has_new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.has_new == 'true'
        run: |
          pip install -r scripts/requirements.txt
          pip show anthropic

      - name: Extract match data from screenshots
        if: steps.check.outputs.has_new == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/process_darts_screenshot.py

      - name: Commit and push results
        if: always() && steps.check.outputs.has_new == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-extract darts match data"
          file_pattern: 'darts/matches.json darts/throws.json darts/incoming/* darts/processed/*'
